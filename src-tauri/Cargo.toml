[package]
name = "ttsforge-studio"
version = "0.1.0"
description = "Local-first desktop frontend for TTSForge"
authors = ["TTSForge contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "ttsforge_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4"] }
